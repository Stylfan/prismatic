name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only credentials for the throwaway CI database.
  MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/prismatic
  APP_DATABASE_URL: postgres://prismatic_app:prismatic_app@localhost:5432/prismatic
  PRISMATIC_APP_PASSWORD: prismatic_app
  # Deliberately low entropy: a placeholder for the test database, not a secret.
  PRISMATIC_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests (row-level security included)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prismatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prismatic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tests/global-setup.ts creates and migrates prismatic_test.
      - run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  image:
    name: Docker images (migrator and runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target migrator -t prismatic-migrator:ci .
      - run: docker build --target runner -t prismatic-runner:ci .
      # A build proves it builds, not that it runs. Pointed at a port nobody
      # listens on, the migrator must fail with its own sentence: that it
      # gets that far proves the image can run its entrypoint.
      - name: The migrator image can run its entrypoint
        run: |
          set -uo pipefail
          set +e
          out=$(docker run --rm \
            -e MIGRATION_DATABASE_URL='postgres://x:x@127.0.0.1:1/x' \
            prismatic-migrator:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::The migrator exited 0 against a database that does not exist."
            exit 1
          fi
          echo "$out" | grep -q "Nothing answers on" || {
            echo "::error::The migrator did not reach its own error handling (exit $code)."
            exit 1
          }

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --prod: this gate is about what ships.
      - run: pnpm audit --prod --audit-level high

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # A tarball fetched and run on every pull request is checked against its published checksum first.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .
